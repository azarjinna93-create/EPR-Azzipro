# nginx site: forwards erp.azzipro.com to the app on 127.0.0.1:5000. certbot adds the HTTPS part.
# Install: cp deploy/nginx-azzi.conf /etc/nginx/sites-available/azzi
#          ln -s /etc/nginx/sites-available/azzi /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name erp.azzipro.com;

    client_max_body_size 6m;          # logo / stamp / photo uploads (the app allows 5 MB)

    location /static/ {
        alias /opt/azzi/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
